[workspace]
resolver = "2"
members = [
    "crates/vayren-core",
    "crates/vayren-domain",
    "crates/vayren-remote-client",
    "crates/vayren-shell",
    "crates/vayren-live-view",
    "crates/vayren-market-view",
    "crates/vayren-portfolio-view",
    "crates/vayren-research-view",
    "crates/vayren-strategy-lab-view",
    "crates/vayren-system-view",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vayren-core = { path = "crates/vayren-core" }
vayren-domain = { path = "crates/vayren-domain" }
vayren-shell = { path = "crates/vayren-shell" }
slint = { version = "~1.17.0", default-features = false }
slint-build = { version = "~1.17.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vayren-remote-client = { path = "crates/vayren-remote-client" }
tungstenite = { version = "0.30", features = ["url", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4"
clipboard-win = "5"
i-slint-backend-testing = "~1.17.0"

[profile.dev]
debug = 0
incremental = true

# Build scripts (including Slint compiler) and proc macros run optimized in dev
[profile.dev.build-override]
opt-level = 2

[profile.test]
debug = 0
incremental = true

# Build scripts (including Slint compiler) and proc macros run optimized in test
[profile.test.build-override]
opt-level = 2

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
# Incremental release builds: only changed units recompile on rebuilds.
# Zero effect on the shipped binary (same opt/LTO/codegen) — it purely
# reuses prior codegen. First build after this pays full price once.
incremental = true

# Build scripts (including the Slint compiler driver in vayren-shell/build.rs)
# run unoptimized by default, so every .slint regen pays debug-speed
# compilation for zero shipped-binary effect. This override optimizes ONLY
# build scripts, proc macros and their dependencies; the shipped
# lib/bin units keep [profile.release] above byte-for-byte.
[profile.release.build-override]
opt-level = 2



