[package]
name = "vayren-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VAYREN native UI (Rust + Slint): application shell — navigation rail, broker panel (first migrated native surface)"

# Packaged-client mode: the shipped EXE/APK defaults to the remote gateway
# (no CLI flag) while developer builds keep the local backend default. Build
# the release client with `--features packaged-remote`. See
# deploy/WINDOWS-PACKAGED-REMOTE.md.
[features]
packaged-remote = []

[lib]
name = "vayren_shell"
crate-type = ["rlib"]

[[bin]]
name = "vayren-shell"
path = "src/main.rs"

[dependencies]
vayren-core = { workspace = true }
vayren-domain = { workspace = true }
vayren-remote-client = { workspace = true }
slint = { workspace = true, default-features = true }
serde = { workspace = true }
serde_json = { workspace = true }
clipboard-win = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
slint = { workspace = true, features = ["renderer-software"] }
