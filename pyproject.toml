# ══════════════════════════════════════════════════════════════════════════════
# VAYREN CORE — PROJECT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "vayren-core"
version = "0.1.0"
description = "AI-Native Quantitative Trading Platform"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vayren" }]
readme = "README.md"

# ── Runtime Dependencies ──────────────────────────────────────
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
]

# ── Development Dependencies ───────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "hypothesis>=6.0",
    "faker>=22.0",
]

# ══════════════════════════════════════════════════════════════════════════════
# TOOL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Ruff (Linter + Formatter) ─────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Pyright (Type Checker) ────────────────────────────────────
[tool.pyright]
typeCheckingMode = "standard"
include = [
    "01_foundation/lib",
    "02_platform/platform",
    "03_market/market",
    "04_signals/signals",
    "05_strategies/strategies",
    "06_risk/risk",
    "07_execution/execution",
    "08_portfolio/portfolio",
    "09_analytics/analytics",
    "10_research/research",
    "11_interfaces/interfaces",
]

# ── Pytest (Test Runner) ──────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "03_market/market/tests",
    "04_signals/signals/tests",
    "05_strategies/strategies/tests",
    "06_risk/risk/tests",
    "07_execution/execution/tests",
    "08_portfolio/portfolio/tests",
    "09_analytics/analytics/tests",
    "10_research/research/tests",
    "02_platform/platform/tests",
    "11_interfaces/interfaces/tests",
    "01_foundation/lib/tests",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# ── Coverage (Test Coverage) ──────────────────────────────────
[tool.coverage.run]
source = [
    "03_market/market",
    "04_signals/signals",
    "05_strategies/strategies",
    "06_risk/risk",
    "07_execution/execution",
    "08_portfolio/portfolio",
    "09_analytics/analytics",
    "10_research/research",
    "02_platform/platform",
    "11_interfaces/interfaces",
    "01_foundation/lib",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

# ══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = [
    "01_foundation/lib",
    "02_platform/platform",
    "03_market/market",
    "04_signals/signals",
    "05_strategies/strategies",
    "06_risk/risk",
    "07_execution/execution",
    "08_portfolio/portfolio",
    "09_analytics/analytics",
    "10_research/research",
    "11_interfaces/interfaces",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
