# ══════════════════════════════════════════════════════════════════════════════
# VAYREN — PROJECT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "vayren-core"
version = "1.22.0"
description = "Event-driven desktop charting platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vayren" }]
readme = "README.md"

# ── Runtime Dependencies ──────────────────────────────────────
# Native-only: the UI shell is a Rust binary; the headless Python backend
# needs only the stdlib plus the optional domain extras below.
dependencies = []

# ── Development Dependencies ───────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "pillow>=10.0",  # icon asset generation (scripts/assets/)
]

# ── Data Domain Extras (historical downloader) ─────────────────
data = [
    "kiteconnect>=4.1",
    "pyotp>=2.9",
    "selenium>=4.0",
    "chromedriver-autoinstaller>=0.4",
]

# ══════════════════════════════════════════════════════════════════════════════
# TOOL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Ruff (Linter + Formatter) ─────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
# 90_brain = docs; 99_archive = legacy reference snapshot (not shipped,
# not tested, not validated — every other tool already ignores it).
extend-exclude = ["90_brain", "99_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# E501: long lines here are embedded Python-strategy source payloads inside
# triple-quoted strings (exec'd verbatim; rewrapping would change strategy
# source bytes/hashes). Same tradeoff as strategy_lab_workspace above.
"05_strategy/strategy/language/storage.py" = ["E501"]
"05_strategy/strategy/tests/test_runtime.py" = ["E501"]
"05_strategy/strategy/tests/test_version_control.py" = ["E501"]
"05_strategy/strategy/tests/test_vm_migration.py" = ["E501"]
"06_backtest/backtest/tests/test_runner.py" = ["E501"]
"06_backtest/backtest/tests/test_batch_worker.py" = ["E501"]

# ── Pyright (Type Checker) ────────────────────────────────────
[tool.pyright]
typeCheckingMode = "standard"
include = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "05_strategy/strategy",
    "06_backtest/backtest",
    "07_risk/risk",
    "08_execution/execution",
    "09_broker/broker",
    "scripts",
]
extraPaths = [
    "02_data",
    "scripts/forensics",
    "scripts/speed",
    "scripts",
]

# ── Pytest (Test Runner) ──────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "00_app/app/tests",
    "01_core/core/tests",
    "02_data/data/tests",
    "05_strategy/strategy/tests",
    "05_strategy/strategy/research/tests",
    "09_broker/broker/tests",
    "scripts/forensics/tests",
    "scripts/tests",
]
addopts = "-v --tb=short"

# ── Coverage (Test Coverage) ──────────────────────────────────
[tool.coverage.run]
source = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "05_strategy/strategy",
    "06_backtest/backtest",
    "07_risk/risk",
    "08_execution/execution",
    "09_broker/broker",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

# ══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "05_strategy/strategy",
    "06_backtest/backtest",
    "07_risk/risk",
    "08_execution/execution",
    "09_broker/broker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
