# ══════════════════════════════════════════════════════════════════════════════
# VAYREN — PROJECT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "vayren-core"
version = "1.32.0"
description = "Event-driven desktop charting platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vayren" }]
readme = "README.md"

# ── Runtime Dependencies ──────────────────────────────────────
# Native-only: the UI shell is a Rust binary; the headless Python backend
# needs only the stdlib plus the optional domain extras below.
dependencies = []

# ── Development Dependencies ───────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.20",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "pillow>=10.0",  # icon asset generation (tools/assets/)
]

# ── Data Domain Extras (historical downloader) ─────────────────
data = [
    "kiteconnect>=4.1",
    "pyotp>=2.9",
    "selenium>=4.0",
    "chromedriver-autoinstaller>=0.4",
]

# ══════════════════════════════════════════════════════════════════════════════
# TOOL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Ruff (Linter + Formatter) ─────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
# 90_brain = docs; 99_archive = legacy reference snapshot (not shipped,
# not tested, not validated — every other tool already ignores it).
extend-exclude = ["90_brain", "99_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# E501: long lines here are embedded Python-strategy source payloads inside
# triple-quoted strings (exec'd verbatim; rewrapping would change strategy
# source bytes/hashes). Same tradeoff as strategy_lab_workspace above.
"src/strategy/language/storage.py" = ["E501"]
"src/strategy/tests/test_runtime.py" = ["E501"]
"src/strategy/tests/test_version_control.py" = ["E501"]
"src/strategy/tests/test_vm_migration.py" = ["E501"]
"src/backtest/tests/test_runner.py" = ["E501"]
"src/backtest/tests/test_batch_worker.py" = ["E501"]

# ── Pyright (Type Checker) ────────────────────────────────────
[tool.pyright]
typeCheckingMode = "standard"
# The declared floor in `requires-python`. Pinning it makes `datetime.UTC`
# (3.11+) resolvable and checks the OLDEST supported version, so a 3.12-only
# feature can never slip in unnoticed.
pythonVersion = "3.11"
include = [
    "src/app",
    "src/core",
    "src/data",
    "src/market",
    "src/strategy",
    "src/backtest",
    "src/risk",
    "src/execution",
    "src/broker",
    "tools",
]
# src/ root so `import core / market / broker / strategy / risk /
# execution / backtest / app` resolves from the TREE — independent of whether a
# (possibly stale) editable install is active.
extraPaths = [
    "src",
    "tools/forensics",
    "tools/speed",
    "tools",
]

# ── Pytest (Test Runner) ──────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "src/app/tests",
    "src/core/tests",
    "src/data/tests",
    "src/market/tests",
    "src/strategy/tests",
    "src/strategy/research/tests",
    "src/backtest/tests",
    "src/risk/tests",
    "src/execution/tests",
    "src/broker/tests",
    "tools/forensics/tests",
    "tools/tests",
]
addopts = "-v --tb=short"

# ── Coverage (Test Coverage) ──────────────────────────────────
[tool.coverage.run]
source = [
    "src/app",
    "src/core",
    "src/data",
    "src/market",
    "src/strategy",
    "src/backtest",
    "src/risk",
    "src/execution",
    "src/broker",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

# ══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/core",
    "src/data",
    "src/market",
    "src/strategy",
    "src/backtest",
    "src/risk",
    "src/execution",
    "src/broker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
