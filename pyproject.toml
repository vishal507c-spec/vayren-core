# ══════════════════════════════════════════════════════════════════════════════
# VAYREN — PROJECT CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

[project]
name = "vayren-core"
version = "1.6.0"
description = "Event-driven desktop charting platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vayren" }]
readme = "README.md"

# ── Runtime Dependencies ──────────────────────────────────────
dependencies = [
    "PySide6>=6.7",
]

# ── Development Dependencies ───────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

# ── Data Domain Extras (historical downloader) ─────────────────
data = [
    "kiteconnect>=4.1",
    "pyotp>=2.9",
    "selenium>=4.0",
    "chromedriver-autoinstaller>=0.4",
]

[project.scripts]
vayren = "app:main"

# ══════════════════════════════════════════════════════════════════════════════
# TOOL CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# ── Ruff (Linter + Formatter) ─────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = ["90_brain"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"04_chart/chart/widgets/*.py" = ["N802"]  # Qt event handlers are camelCase by framework convention
"02_data/data/ui/*.py" = ["N802"]  # Qt signal handlers are camelCase by framework convention
"00_app/app/ui/strategy_lab_workspace.py" = ["E501", "SIM105", "N814", "C420"]

# ── Pyright (Type Checker) ────────────────────────────────────
[tool.pyright]
typeCheckingMode = "standard"
include = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "04_chart/chart",
    "scripts",
]
extraPaths = [
    "02_data",
    "scripts/forensics",
]

# ── Pytest (Test Runner) ──────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "00_app/app/tests",
    "01_core/core/tests",
    "02_data/data/tests",
    "03_market/market/tests",
    "04_chart/chart/tests",
    "scripts/forensics/tests",
]
addopts = "-v --tb=short"

# ── Coverage (Test Coverage) ──────────────────────────────────
[tool.coverage.run]
source = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "04_chart/chart",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

# ══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ══════════════════════════════════════════════════════════════════════════════

[tool.hatch.build.targets.wheel]
packages = [
    "00_app/app",
    "01_core/core",
    "02_data/data",
    "03_market/market",
    "04_chart/chart",
    "05_strategy/strategy",
    "06_backtest/backtest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
