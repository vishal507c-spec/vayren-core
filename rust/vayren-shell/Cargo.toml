[package]
name = "vayren-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VAYREN native UI (Rust + Slint): application shell — navigation rail, broker panel (first migrated native surface)"

[lib]
name = "vayren_shell"
crate-type = ["rlib"]

[[bin]]
name = "vayren-shell"
path = "src/main.rs"

[dependencies]
vayren-core = { path = "../vayren-core" }
slint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
i-slint-backend-testing = "1.17"
slint = { version = "1.17", features = ["renderer-software"] }
