[package]
name = "vayren-live-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeddable native Live view (Rust + Slint software renderer, C ABI for the Qt host)"

[lib]
name = "vayren_live_view"
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "renderer-software",
    "compat-1-2",
] }
vayren-shell = { path = "../vayren-shell" }
serde_json = "1"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
serde_json = "1"
