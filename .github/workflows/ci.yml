name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: dtolnay/rust-toolchain@stable
      # Mirror `make check`: rust + lint + format + typecheck + tests + validators.
      - run: python scripts/build_rust.py --test
      - run: cd rust && cargo fmt --all -- --check
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: python scripts/run_tests.py
      - run: python scripts/validate_structure.py
      - run: python scripts/validate_imports.py
      - run: python scripts/validate_language_ownership.py
      - run: python scripts/validate_migration.py
      - run: python scripts/validate_architecture_gate.py
