name: CI

on: [push, pull_request]

# Superseded runs waste runner-minutes: cancel them, but never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Job map (every original check preserved — see per-job comments):
#   quality    = ruff check + ruff format + pyright            (~2-3 min)
#   validators = all repo validators + context engine          (~2 min)
#   rust       = cargo fmt + full Rust build/test (cached)      (bottleneck)
#   integration= python test suites (needs the Rust outputs)    (~10 min)
#   gate       = aggregate "ALL REQUIRED CHECKS PASSED" signal
# Jobs without `needs:` run in parallel; every job runs to completion
# independently so one failure never hides another.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - run: python scripts/validate_structure.py
      - run: python scripts/validate_imports.py
      - run: python scripts/validate_language_ownership.py
      - run: python scripts/validate_architecture_gate.py
      - run: python scripts/validate_authority.py
      - run: python scripts/validate_routes.py
      - run: python scripts/context_engine.py --check

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Cache SAVE needs write; checkout still needs read (a permissions
    # block replaces defaults, so contents:read must stay explicit).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The Slint workspace emits multi-GB release+debug+test artifacts and
      # exhausts the runner disk (linker SIGBUS / ENOSPC archives). Reclaim
      # space from preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # Native build prerequisites (Slint font stack links fontconfig via
      # pkg-config; without the dev package yeslogic-fontconfig-sys fails).
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      # Dependency-only cache (workspace crates rebuild; see README of
      # Swatinem/rust-cache). Workspace lives in rust/ (NOT repo root), so
      # the mapping must be explicit — the default ". -> target" would cache
      # a nonexistent dir. Saved from main only: PRs restore read-only, so a
      # poisoned/untrusted cache can never be written by untrusted code.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "vayren-rust"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Formatting first: a 2s style failure must not wait behind a 38min build.
      - run: cd rust && cargo fmt --all -- --check
      # Mirror `make check`: full build + workspace tests.
      - run: python scripts/build_rust.py --test
      - name: Report disk usage
        run: |
          du -sh rust/target ~/.cargo/registry 2>/dev/null || true
          df -h /

  integration:
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Same disk pressure as the rust job: this job restores the shared Rust
      # cache and runs an incremental build, so the cleanup stays.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # Needed for the incremental rebuild inside run_tests.py (toolchain to
      # invoke cargo, fontconfig dev files to relink the Slint stack).
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - uses: dtolnay/rust-toolchain@stable
      # Restore-only: the rust job already saved this exact key on main, and
      # re-saving an identical multi-GB cache would just burn minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "vayren-rust"
          save-if: "false"
      - name: Report disk usage
        run: df -h /
      # run_tests.py rebuilds incrementally (fast on a warm cache) then runs
      # all six pytest partitions. Requires the compiled cdylib from the
      # shared Rust cache — hence needs: [rust], never a duplicate full build.
      - run: python scripts/run_tests.py

  gate:
    name: CI gate
    needs: [quality, validators, rust, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "ALL REQUIRED CHECKS PASSED (quality, validators, rust, integration)"
