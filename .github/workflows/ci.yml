name: CI

on: [push, pull_request]

# Superseded runs waste runner-minutes: cancel them, but never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Job map (every original check preserved — see per-job comments):
#   quality    = ruff check + ruff format + pyright            (~1 min)
#   validators = all repo validators + context engine          (~1 min)
#   build-test = cargo fmt + lean Rust build/test + pytest     (~13 min)
#   test-shard-stateful = live-mutator suites, serial          (~9 min)
#   test-shard-pure     = isolated/reader suites, serial       (~8 min)
#   gate       = aggregate "ALL REQUIRED CHECKS PASSED" signal
# quality/validators run parallel to build-test: cheap failures surface in
# ~1 minute and every domain reports independently. build-test stays ONE job
# on purpose: the pytest suites need the just-built workspace (same target/
# dir), so splitting build from test would force a second full compilation
# (measured: +40m on a cold cache) or a fragile artifact handoff. No check
# is skipped anywhere; a failure in any job fails the gate.
# scripts/tests is sharded by dependency evidence (Day-6 intel: the two
# live-tree mutators must stay serial vs index readers; same-checkout
# parallel pytest is race-proven unsafe): mutators run serially in
# test-shard-stateful, readers serially in test-shard-pure, on isolated
# runners. test_desktop.py runs in build-test beside its shell binary.
# Coverage contract: scripts/tests/test_shard_contract.py pins that every
# test file runs in exactly one CI site (no omission, no duplication).
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - run: python scripts/validate_structure.py
      - run: python scripts/validate_imports.py
      - run: python scripts/validate_language_ownership.py
      - run: python scripts/validate_architecture_gate.py
      - run: python scripts/validate_authority.py
      - run: python scripts/validate_routes.py
      - run: python scripts/context_engine.py --check

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Cache SAVE needs write; checkout still needs read (a permissions
    # block replaces defaults, so contents:read must stay explicit).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The Slint workspace emits multi-GB release+debug+test artifacts and
      # exhausts the runner disk (linker SIGBUS / ENOSPC archives). Reclaim
      # space from preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # Native build prerequisites (Slint font stack links fontconfig via
      # pkg-config; without the dev package yeslogic-fontconfig-sys fails).
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - uses: dtolnay/rust-toolchain@stable
      # Dependency-only cache (workspace crates rebuild; see README of
      # Swatinem/rust-cache). Workspace lives in rust/ (NOT repo root), so
      # the mapping must be explicit — the default ". -> target" would cache
      # a nonexistent dir. Saves on every branch: GitHub isolates caches per
      # branch (main never restores branch caches), and this private
      # single-owner repo has no forks/external writers, so branch saves
      # cannot poison main. Failed runs never save (cache-on-failure=false).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "vayren-rust"
      # Formatting first: a 2s style failure must not wait behind a 38min build.
      - run: cd rust && cargo fmt --all -- --check
      # CI measurement (Day-3 intelligence: wall-clock + cache effectiveness).
      # Behavior-preserving: same commands, only observed (`time` + snapshots
      # in the log). No CI improvement is claimed until runs prove it.
      - name: Pre-build cache snapshot
        run: |
          date -u +%FT%TZ
          du -sh ~/.cargo/registry ~/.cargo/git rust/target 2>/dev/null || true
          df -h /
      # Lean test path (verified Day-4/5: `cargo test --workspace` is
      # self-contained; only the kernel cdylib + shell binary are required
      # downstream; the six view release DLLs have no consumer on this path
      # and are skipped — same tests, same coverage, smaller build).
      # Full build + workspace tests, then the pytest suites against the SAME
      # workspace: --skip-build reuses the just-built artifacts only when the
      # fail-closed freshness gate proves them newer than every Rust source
      # (otherwise it rebuilds) — hence one job, no duplicate full chain.
      # scripts/tests runs in the shard jobs below (--exclude here);
      # test_desktop.py stays here beside its shell binary.
      - run: time python scripts/build_rust.py --lean-test
      - run: time python scripts/run_tests.py --skip-build --lean --exclude scripts/tests
      - run: python -m pytest scripts/tests/test_desktop.py -q --no-header
      - name: Report disk usage
        run: |
          date -u +%FT%TZ
          du -sh rust/target ~/.cargo/registry ~/.cargo/git 2>/dev/null || true
          df -h /

  # Shard 1/2 — live-tree mutators, serial within the job, isolated runner.
  # test_validate_scope.py + test_failure_intel.py mutate the live tree
  # (TreeEdit + restore); same-checkout parallel pytest is race-proven
  # unsafe (Day-6 intel), so mutators never share a runner with readers.
  # Needs only the kernel cdylib (scope-bench executes pytest partitions).
  test-shard-stateful:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "vayren-rust"
      - run: cargo build --release -p vayren-core --manifest-path rust/Cargo.toml
      - run: python -m pytest scripts/tests/test_validate_scope.py scripts/tests/test_failure_intel.py -q --no-header

  # Shard 2/2 — isolated readers, serial within the job, isolated runner.
  # Every file here is tmp/sandbox/mock-scoped or read-only (Day-6 intel);
  # test_desktop.py runs in build-test beside its shell binary instead.
  test-shard-pure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,data]"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          shared-key: "vayren-rust"
      - run: cargo build --release -p vayren-core --manifest-path rust/Cargo.toml
      - run: >-
          python -m pytest scripts/tests/test_authority.py
          scripts/tests/test_build_rust.py scripts/tests/test_context.py
          scripts/tests/test_context_packet.py scripts/tests/test_execute_surface.py
          scripts/tests/test_gate_coverage.py scripts/tests/test_language_governance.py
          scripts/tests/test_patch_surface.py scripts/tests/test_repo_graph.py
          scripts/tests/test_repo_index.py scripts/tests/test_router.py
          scripts/tests/test_run_tests.py scripts/tests/test_self_opt.py
          scripts/tests/test_shard_contract.py scripts/tests/test_speed_loop.py
          scripts/tests/test_speed_metrics.py scripts/tests/test_vayren_intel.py -q --no-header

  gate:
    name: CI gate
    needs: [quality, validators, build-test, test-shard-stateful, test-shard-pure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "ALL REQUIRED CHECKS PASSED (quality, validators, build-test, test-shard-stateful, test-shard-pure)"
